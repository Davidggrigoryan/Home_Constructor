<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Constructor</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>Home Constructor</h1>
        <p>Планирование и оценка стоимости строительства собственного дома</p>
    </header>

    <main>
        <section id="calculator" class="card">
            <h2>Калькулятор стоимости</h2>
            <form id="cost-form">
                <div class="form-row">
                    <label for="floor-area">Площадь дома (м²)</label>
                    <input type="number" id="floor-area" min="20" value="120" required />
                </div>
                <div class="form-row">
                    <label for="floors">Количество этажей</label>
                    <input type="number" id="floors" min="1" max="3" value="2" required />
                </div>
                <div class="form-row">
                    <label for="material">Материал стен</label>
                    <select id="material">
                        <option value="brick">Кирпич</option>
                        <option value="wood">Клеёный брус</option>
                        <option value="frame">Каркасный</option>
                        <option value="aerated">Газобетон</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="finish">Отделка</label>
                    <select id="finish">
                        <option value="basic">Базовая</option>
                        <option value="standard">Стандартная</option>
                        <option value="premium">Премиум</option>
                    </select>
                </div>
                <div class="form-row">
                    <label for="extras">Дополнительные опции</label>
                    <div class="checkbox-group" id="extras">
                        <label><input type="checkbox" value="garage" /> Встроенный гараж</label>
                        <label><input type="checkbox" value="terrace" /> Терраса</label>
                        <label><input type="checkbox" value="solar" /> Солнечные панели</label>
                    </div>
                </div>
                <button type="submit" class="primary">Рассчитать</button>
            </form>
            <div id="cost-result" class="result">
                <h3>Итоговая стоимость</h3>
                <p class="value">—</p>
                <p class="hint">Введите параметры и нажмите «Рассчитать»</p>
            </div>
        </section>

        <section id="designer" class="card">
            <h2>Конструктор помещений</h2>
            <form id="room-form">
                <div class="form-row">
                    <label for="room-name">Помещение</label>
                    <input type="text" id="room-name" placeholder="Например, гостиная" required />
                </div>
                <div class="form-grid">
                    <div class="form-row">
                        <label for="room-width">Ширина (м)</label>
                        <input type="number" id="room-width" min="2" step="0.5" value="5" required />
                    </div>
                    <div class="form-row">
                        <label for="room-length">Длина (м)</label>
                        <input type="number" id="room-length" min="2" step="0.5" value="6" required />
                    </div>
                </div>
                <button type="submit" class="primary">Добавить помещение</button>
            </form>

            <div id="room-summary" class="result">
                <h3>Сводка проекта</h3>
                <p class="value">Общая площадь: <span id="total-area">0</span> м²</p>
                <ul id="room-list"></ul>
            </div>

            <div id="layout">
                <div id="layout-grid" aria-label="Схема помещений"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2024 Home Constructor. Проектирование домов доступно каждому.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
